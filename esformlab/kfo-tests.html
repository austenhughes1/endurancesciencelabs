<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KFO test runner (admin)</title>
<style>
  :root { --bg:#0a0d14; --panel:#121724; --border:#243044; --border2:#2a3550; --txt:#e6ecf5;
          --muted2:#8aa0c0; --good:#22c78a; --bad:#ff5d5d; --gold:#f5c451; --purple:#8b7cf8;
          --cyan:#00e5c8; --warn:#f5a623; --mono:"Space Mono","Courier New",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:13px/1.55 var(--mono); }
  header { padding:16px 20px; border-bottom:1px solid var(--border); }
  h1 { margin:0; font-size:16px; }
  .sub { color:var(--muted2); font-size:11.5px; margin-top:4px; }
  .wrap { padding:18px 20px 60px; max-width:1100px; }
  .panel { background:var(--panel); border:1px solid var(--border2); border-radius:10px;
           padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; font-size:12px; padding:7px 13px; border-radius:7px;
           border:1px solid var(--border2); background:transparent; color:inherit; cursor:pointer; }
  button.primary { background:var(--gold); color:#1a1400; border-color:var(--gold); font-weight:700; }
  button:hover { border-color:var(--gold); }
  pre { white-space:pre-wrap; margin:0; font-size:11.5px; line-height:1.6; }
  .pass { color:var(--good); } .fail { color:var(--bad); }
  .tally { font-size:20px; font-weight:700; }
  .lbl { font-size:10px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
         color:var(--muted2); margin-bottom:6px; }
  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  td, th { padding:4px 6px; text-align:left; border-bottom:1px solid var(--border); }
  .hidden { display:none; }
</style>
</head>
<body>

<div id="kfo-gate"></div>

<div id="app" class="hidden">
  <header>
    <h1>Kinematic Force-Orientation — test runner</h1>
    <div class="sub">Unit, integration, copy-audit, export and validation-harness tests.
      Same suite as <code>node kfo-tests.js</code>. Internal tool; not linked from the product.</div>
  </header>

  <div class="wrap">
    <div class="panel">
      <div class="row">
        <button class="primary" onclick="runAll()">▶ Run all tests</button>
        <button onclick="showFlags()">Show feature flags</button>
        <button onclick="showSample()">Render a sample report</button>
        <span id="tally" class="tally"></span>
      </div>
    </div>

    <div class="panel">
      <div class="lbl">Results</div>
      <pre id="out">Not run yet.</pre>
    </div>

    <div class="panel" id="flags-panel" style="display:none">
      <div class="lbl">Feature flags</div>
      <div id="flags-out"></div>
    </div>

    <div class="panel" id="sample-panel" style="display:none">
      <div class="lbl">Sample rendered report (synthetic fixture: more braking on the right)</div>
      <div id="sample-out"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="/shared/site.js"></script>

<script src="gait-data.js"></script>
<script src="kfo-core.js"></script>
<script src="kfo-vertical-force.js"></script>
<script src="kfo-reference.js"></script>
<script src="kfo-estimators.js"></script>
<script src="kfo-analysis.js"></script>
<script src="kfo-render.js"></script>
<script src="kfo-export.js"></script>
<script src="kfo-tests.js"></script>

<script>
esLabs.mountAuthGate('#kfo-gate', {
  eyebrow: '⬡ Admin',
  headline: 'KFO test runner',
  sub: 'Internal validation suite for the Kinematic Force-Orientation feature.',
  requireAdmin: true
});
esLabs.onAuthChange(function (user) {
  var isAdmin = user && user.uid === esLabs.ADMIN_UID;
  document.getElementById('app').classList.toggle('hidden', !isAdmin);
});

function runAll() {
  var res = KFOTests.run({ quiet: true, noExit: true });
  var out = document.getElementById('out');
  out.innerHTML = res.results.map(function (r) {
    return '<span class="' + (r.pass ? 'pass' : 'fail') + '">' + (r.pass ? 'PASS' : 'FAIL') + '</span>  ' +
      escapeHtml(r.suite) + ' › ' + escapeHtml(r.name) +
      (r.pass ? '' : '\n        <span class="fail">' + escapeHtml(r.error) + '</span>');
  }).join('\n');
  var t = document.getElementById('tally');
  t.textContent = res.passed + '/' + res.total + ' passed';
  t.className = 'tally ' + (res.failed ? 'fail' : 'pass');
}

function showFlags() {
  var panel = document.getElementById('flags-panel');
  panel.style.display = 'block';
  if (typeof KFOApp === 'undefined') {
    document.getElementById('flags-out').innerHTML =
      '<div style="color:var(--muted2)">kfo-app.js is not loaded on this page. ' +
      'Flags are managed from the esFormLab page via <code>KFOApp.help()</code>.</div>';
    return;
  }
  var st = KFOApp.flagState();
  document.getElementById('flags-out').innerHTML = '<table><tr><th>Flag</th><th>State</th><th>Description</th></tr>' +
    Object.keys(st).map(function (k) {
      return '<tr><td>' + escapeHtml(k) + '</td><td class="' + (st[k].enabled ? 'pass' : '') + '">' +
        (st[k].enabled ? 'on' : 'off') + '</td><td>' + escapeHtml(st[k].description) + '</td></tr>';
    }).join('') + '</table>';
}

function showSample() {
  document.getElementById('sample-panel').style.display = 'block';
  var samples = KFOTests.fixtures.clip({ overstrideBiasRight: 30 });
  var result = KFOAnalysis.analyze({ samples: samples });
  document.getElementById('sample-out').innerHTML = KFORender.buildHtml(result);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
