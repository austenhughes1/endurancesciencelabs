<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>try{if(localStorage.getItem('esl-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine validation (admin) — Endurance Science Labs</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/site.css?v=20261016">
<link rel="stylesheet" href="../css/esmetaboliclab.css?v=20261016">
<style>
  main { display: none; }
  .test-block { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 18px; background: var(--panel); }
  .test-block h2 { font: 700 17px/1.3 var(--ui); letter-spacing: -.2px; margin-bottom: 12px; }
  .test-block .esl-table-wrap { background: var(--panel); }
  .test-block table { width: 100%; border-collapse: collapse; font: 400 13px/1.45 var(--ui); }
  .test-block :is(th, td) { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .test-block tr:last-child > td { border-bottom: 0; }
  .test-block th { font: 600 12px/1.35 var(--ui); text-transform: none; letter-spacing: 0; color: var(--muted2); background: var(--panel2); white-space: nowrap; }
  .test-block .num { font-family: var(--mono); font-weight: 700; color: var(--text); white-space: nowrap; }
  .summary { font: 400 13px/1.5 var(--ui); color: var(--muted2); margin-top: 12px; }
</style>
</head>
<body class="esml-tool">

<div id="esml-gate"></div>

<nav class="eslabs-nav" id="esml-nav" style="display:none"></nav>

<main id="main" class="page">
  <a class="esl-back" href="/esmetaboliclab/">← esMetabolicLab</a>
  <h1 class="page-title">Engine validation</h1>
  <p class="page-sub">Mader/Heck implementation correctness checks. All tests should pass before the engine is trusted.</p>

  <div id="results"><div class="esl-loading" role="status"><span class="esl-spin" aria-hidden="true"></span>Running engine checks…</div></div>
  <div id="ref-results"></div>
</main>

<footer class="esl-app-footer" id="tests-footer" hidden>
  <p class="esl-app-footer-meta"><a href="/privacy/">Privacy</a> · © <span id="footer-year"></span> Endurance Science Labs</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="/shared/site.js?v=20261016"></script>
<script>
  esLabs.mountNav('#esml-nav', { active: 'esmetlab' });
  esLabs.mountAuthGate('#esml-gate', {
    eyebrow: '⬡ Admin only',
    headline: 'Engine validation',
    sub: 'This page runs the engine validation suite. Sign in with your admin account to continue.',
    requireAdmin: true,
    foot: '<a href="/">&larr; Back to home</a>'
  });

  esLabs.onAuthChange(function(user) {
    // isAdmin() checks the real account, so acting-as still renders the page.
    if (user && esLabs.isAdmin()) {
      document.getElementById('esml-nav').style.display = 'flex';
      document.getElementById('main').style.display = 'block';
      document.getElementById('tests-footer').hidden = false;
      if (typeof runSuite === 'function') runSuite();
    } else {
      document.getElementById('esml-nav').style.display = 'none';
      document.getElementById('main').style.display = 'none';
      document.getElementById('tests-footer').hidden = true;
    }
  });
  document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>

<script type="module">
import * as eng from '../js/lib/mader/index.js';
import { REFERENCE_CASES, unitChecks } from '../js/lib/validation/reference-cases.js';
import { vO2ToIntensity } from '../js/lib/mader/sport.js';

// A crashing suite shows its error instead of leaving a blank block.
const crash = (t, e) => '<div class="test-block"><h2>' + t + '</h2><div class="esl-callout esl-callout--bad" role="alert"><p class="esl-callout-title">Suite crashed</p><p>'
  + String((e && e.message) || e).replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;')) + '</p></div></div>';
const pill = (ok) => '<span class="esl-badge ' + (ok ? 'esl-badge--good' : 'esl-badge--bad') + '">' + (ok ? 'PASS' : 'FAIL') + '</span>';

window.runSuite = function () {
  const u = document.getElementById('results');
  const r = document.getElementById('ref-results');
  u.innerHTML = ''; r.innerHTML = '';
  // ── Unit checks ──────────────────────────────
  try {
  const unit = unitChecks(eng);
  let unitPass = 0;
  let html = '<div class="test-block"><h2>Kinetic unit checks</h2><div class="esl-table-wrap"><table>';
  html += '<thead><tr><th>Check</th><th>Got</th><th>Expected</th><th>Status</th></tr></thead><tbody>';
  for (const c of unit) {
    if (c.ok) unitPass++;
    html += '<tr><td>' + c.name + '</td><td class="num">' + c.actual + '</td>'
         + '<td>' + c.expected + '</td><td>' + pill(c.ok) + '</td></tr>';
  }
  html += '</tbody></table></div><div class="summary">' + unitPass + '/' + unit.length + ' passed</div></div>';
  u.innerHTML = html;
  } catch (e) { u.insertAdjacentHTML('beforeend', crash('Kinetic unit checks', e)); }

  // ── Reference cases ──────────────────────────
  try {
  let refHtml = '<div class="test-block"><h2>Reference cases (published targets)</h2><div class="esl-table-wrap"><table>';
  refHtml += '<thead><tr><th>Case</th><th>Quantity</th><th>Got</th><th>Target</th><th>Tol</th><th>Status</th></tr></thead><tbody>';

  let refPass = 0, refTotal = 0;
  for (const c of REFERENCE_CASES) {
    const profile = eng.getMetabolicProfile(c.inputs);
    if ('MLSS_W' in c.expected) {
      refTotal++;
      const got = profile.mlss.intensity;
      const tgt = c.expected.MLSS_W.value;
      const tol = c.expected.MLSS_W.tol;
      const ok = Math.abs(got - tgt) <= tol;
      if (ok) refPass++;
      refHtml += '<tr><td>' + c.id + '</td><td>MLSS (W)</td>'
              + '<td class="num">' + got.toFixed(1) + '</td><td>' + tgt + '</td>'
              + '<td>±' + tol + '</td><td>' + pill(ok) + '</td></tr>';
    }
    if ('MLSS_relative_lower_than' in c.expected) {
      refTotal++;
      const got = profile.mlss.x;
      const max = c.expected.MLSS_relative_lower_than;
      const ok = got < max;
      if (ok) refPass++;
      refHtml += '<tr><td>' + c.id + '</td><td>MLSS / VO₂max</td>'
              + '<td class="num">' + (got * 100).toFixed(1) + '%</td><td>&lt; ' + (max * 100).toFixed(0) + '%</td>'
              + '<td>—</td><td>' + pill(ok) + '</td></tr>';
    }
    if ('MLSS_relative_higher_than' in c.expected) {
      refTotal++;
      const got = profile.mlss.x;
      const min = c.expected.MLSS_relative_higher_than;
      const ok = got > min;
      if (ok) refPass++;
      refHtml += '<tr><td>' + c.id + '</td><td>MLSS / VO₂max</td>'
              + '<td class="num">' + (got * 100).toFixed(1) + '%</td><td>&gt; ' + (min * 100).toFixed(0) + '%</td>'
              + '<td>—</td><td>' + pill(ok) + '</td></tr>';
    }
  }
  refHtml += '</tbody></table></div><div class="summary">' + refPass + '/' + refTotal + ' passed</div></div>';
  r.innerHTML = refHtml;
  } catch (e) { r.insertAdjacentHTML('beforeend', crash('Reference cases (published targets)', e)); }

  // ── Sensitivity check (Section 5.1, Case 4) ──
  // Build a synthetic step-test that's consistent with the canonical case,
  // then perturb each stage by ±0.5 mmol/L and verify VO2max moves <~2%.
  try {
  const synth = {
    sport: 'cycling',
    bodyMass: 70,
    VLamax: 0.5,
    steps: [
      { intensity: 150, durationMin: 4, lactate: 1.4 },
      { intensity: 200, durationMin: 4, lactate: 1.9 },
      { intensity: 240, durationMin: 4, lactate: 2.8 },
      { intensity: 270, durationMin: 4, lactate: 4.0 },
      { intensity: 300, durationMin: 4, lactate: 6.5 },
    ],
  };
  const fitted = eng.getMetabolicProfile(synth);
  const sens = fitted.diagnostics.sensitivity;
  const sensOk = sens && (sens.max_VO2max_shift / sens.base_VO2max) < 0.05;
  const sensHtml = '<div class="test-block"><h2>Sensitivity (synthetic step test)</h2><div class="esl-table-wrap"><table>'
          + '<thead><tr><th>Quantity</th><th>Value</th><th>Status</th></tr></thead><tbody>'
          + '<tr><td>Fitted VO₂max</td><td class="num">' + fitted.VO2max.toFixed(1) + ' mL/min/kg</td><td>—</td></tr>'
          + '<tr><td>Fit RMSE (lactate)</td><td class="num">' + fitted.diagnostics.rmse.toFixed(3) + ' mmol/L</td><td>—</td></tr>'
          + (sens ? ('<tr><td>Max VO₂max shift for ±0.5 mmol/L lactate</td>'
                  + '<td class="num">' + sens.max_VO2max_shift.toFixed(2) + ' mL/min/kg ('
                  + (sens.max_VO2max_shift / sens.base_VO2max * 100).toFixed(2) + '%)</td>'
                  + '<td>' + pill(sensOk) + '</td></tr>') : '')
          + '</tbody></table></div></div>';
  r.insertAdjacentHTML('beforeend', sensHtml);
  } catch (e) { r.insertAdjacentHTML('beforeend', crash('Sensitivity (synthetic step test)', e)); }
};

// The auth handler may have fired before this module loaded (race): run now.
if (window.esLabs && esLabs.user && esLabs.isAdmin()) window.runSuite();
</script>

</body>
</html>
